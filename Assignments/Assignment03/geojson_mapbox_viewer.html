<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoJSON Network Location Viewer</title>
    
    <!-- Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
        
        .map-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 300px;
            z-index: 1000;
        }
        
        .map-overlay h3 {
            margin: 0 0 15px 0;
            color: #333;
            font-size: 16px;
        }
        
        .layer-control {
            margin: 8px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .layer-control label {
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .layer-control input[type="checkbox"] {
            cursor: pointer;
            transform: scale(1.2);
        }
        
        .color-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        
        .stats {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #666;
        }
        
        .stats-item {
            margin: 4px 0;
        }
        
        /* Legend */
        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }
        
        .legend h4 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #333;
        }
        
        .legend-item {
            margin: 6px 0;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* Popup styling */
        .mapboxgl-popup-content {
            max-width: 300px;
            padding: 15px;
        }
        
        .popup-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        
        .popup-info {
            font-size: 12px;
            line-height: 1.4;
        }
        
        .popup-url {
            word-break: break-all;
            color: #0066cc;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <!-- Layer Control Panel -->
    <div class="map-overlay">
        <h3>🌐 Network Locations</h3>
        
        <div class="layer-control">
            <label>
                <input type="checkbox" id="nitter-toggle" checked>
                <span class="color-indicator" style="background-color: #9b59b6;"></span>
                Nitter
            </label>
        </div>
        
        <div class="layer-control">
            <label>
                <input type="checkbox" id="x-toggle" checked>
                <span class="color-indicator" style="background-color: #1da1f2;"></span>
                X.com (Twitter)
            </label>
        </div>
        
        <div class="layer-control">
            <label>
                <input type="checkbox" id="youtube-toggle" checked>
                <span class="color-indicator" style="background-color: #ff0000;"></span>
                YouTube
            </label>
        </div>
        
        <div class="layer-control">
            <label>
                <input type="checkbox" id="steam-toggle" checked>
                <span class="color-indicator" style="background-color: #171a21;"></span>
                Steam
            </label>
        </div>
        
        <div class="layer-control">
            <label>
                <input type="checkbox" id="huggingface-toggle" checked>
                <span class="color-indicator" style="background-color: #ff9500;"></span>
                HuggingFace
            </label>
        </div>
        
        <div class="layer-control">
            <label>
                <input type="checkbox" id="discord-toggle" checked>
                <span class="color-indicator" style="background-color: #5865f2;"></span>
                Discord
            </label>
        </div>
        
        <div class="layer-control">
            <label>
                <input type="checkbox" id="reddit-toggle" checked>
                <span class="color-indicator" style="background-color: #ff4500;"></span>
                Reddit
            </label>
        </div>
        
        <div class="stats">
            <div class="stats-item">Total Locations: <span id="total-count">0</span></div>
            <div class="stats-item">Visible Points: <span id="visible-count">0</span></div>
        </div>
    </div>
    
    <!-- Legend -->
    <div class="legend">
        <h4>Legend</h4>
        <div class="legend-item">
            <span class="color-indicator" style="background-color: #9b59b6;"></span>
            Nitter - Alternative Twitter
        </div>
        <div class="legend-item">
            <span class="color-indicator" style="background-color: #1da1f2;"></span>
            X.com - Social Media
        </div>
        <div class="legend-item">
            <span class="color-indicator" style="background-color: #ff0000;"></span>
            YouTube - Video Platform
        </div>
        <div class="legend-item">
            <span class="color-indicator" style="background-color: #171a21;"></span>
            Steam - Gaming Platform
        </div>
        <div class="legend-item">
            <span class="color-indicator" style="background-color: #ff9500;"></span>
            HuggingFace - AI Platform
        </div>
        <div class="legend-item">
            <span class="color-indicator" style="background-color: #5865f2;"></span>
            Discord - Gaming/Chat Platform
        </div>
        <div class="legend-item">
            <span class="color-indicator" style="background-color: #ff4500;"></span>
            Reddit - Social News Platform
        </div>
    </div>

    <script>
        // Initialize Mapbox (using a free token - replace with your own for production)
        mapboxgl.accessToken = 'pk.eyJ1IjoiYW5kcmV3OWl1IiwiYSI6ImNtZGk0ejdrZTA5OWQyaXBtdWhlMTdpd2EifQ.SG4pkm1FkJI79DoutAJmrw';
        
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11', // Dark theme for better contrast
            center: [0, 20], // Center of the world
            zoom: 2
        });
        
        // Dataset configurations
        const datasets = [
            {
                id: 'nitter',
                file: 'outputs/nitter.net_locations.geojson',
                color: '#9b59b6',
                name: 'Nitter'
            },
            {
                id: 'x',
                file: 'outputs/x.com_locations.geojson',
                color: '#1da1f2',
                name: 'X.com'
            },
            {
                id: 'youtube',
                file: 'outputs/www.youtube.com_locations.geojson',
                color: '#ff0000',
                name: 'YouTube'
            },
            {
                id: 'steam',
                file: 'outputs/store.steampowered.com_locations.geojson',
                color: '#171a21',
                name: 'Steam'
            },
            {
                id: 'huggingface',
                file: 'outputs/huggingface.geojson',
                color: '#ff9500',
                name: 'HuggingFace'
            },
            {
                id: 'discord',
                file: 'outputs/discord.com_locations.geojson',
                color: '#5865f2',
                name: 'Discord'
            },
            {
                id: 'reddit',
                file: 'outputs/www.reddit.com_locations.geojson',
                color: '#ff4500',
                name: 'Reddit'
            }
        ];
        
        let totalLocations = 0;
        
        map.on('load', function() {
            // Load each dataset
            datasets.forEach(dataset => {
                loadDataset(dataset);
            });
            
            // Set up toggle controls
            datasets.forEach(dataset => {
                const toggle = document.getElementById(`${dataset.id}-toggle`);
                toggle.addEventListener('change', function() {
                    const visibility = this.checked ? 'visible' : 'none';
                    map.setLayoutProperty(`${dataset.id}-layer`, 'visibility', visibility);
                    updateVisibleCount();
                });
            });
            
            // Add navigation controls
            map.addControl(new mapboxgl.NavigationControl());
            map.addControl(new mapboxgl.FullscreenControl());
        });
        
        function loadDataset(dataset) {
            fetch(dataset.file)
                .then(response => response.json())
                .then(data => {
                    // Add source
                    map.addSource(dataset.id, {
                        'type': 'geojson',
                        'data': data
                    });
                    
                    // Add layer
                    map.addLayer({
                        'id': `${dataset.id}-layer`,
                        'type': 'circle',
                        'source': dataset.id,
                        'paint': {
                            'circle-radius': [
                                'interpolate',
                                ['linear'],
                                ['zoom'],
                                2, 4,
                                10, 8,
                                15, 12
                            ],
                            'circle-color': dataset.color,
                            'circle-opacity': 0.8,
                            'circle-stroke-width': 1,
                            'circle-stroke-color': '#ffffff',
                            'circle-stroke-opacity': 0.6
                        }
                    });
                    
                    // Add hover effect
                    map.on('mouseenter', `${dataset.id}-layer`, function() {
                        map.getCanvas().style.cursor = 'pointer';
                    });
                    
                    map.on('mouseleave', `${dataset.id}-layer`, function() {
                        map.getCanvas().style.cursor = '';
                    });
                    
                    // Add click popup
                    map.on('click', `${dataset.id}-layer`, function(e) {
                        const properties = e.features[0].properties;
                        const coordinates = e.features[0].geometry.coordinates.slice();
                        
                        // Ensure popup appears if the map is zoomed out
                        while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
                            coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
                        }
                        
                        const popupContent = `
                            <div class="popup-title">${dataset.name} Server Location</div>
                            <div class="popup-info">
                                <strong>IP:</strong> ${properties.ip}<br>
                                <strong>Location:</strong> ${properties.city}, ${properties.region}<br>
                                <strong>Country:</strong> ${properties.country}<br>
                                <strong>Organization:</strong> ${properties.org || 'Unknown'}<br>
                                <strong>Source:</strong> ${properties.source || 'Unknown'}
                            </div>
                            <div class="popup-url">
                                <strong>Sample URL:</strong><br>
                                ${properties.url ? properties.url.substring(0, 80) + '...' : 'Not available'}
                            </div>
                        `;
                        
                        new mapboxgl.Popup()
                            .setLngLat(coordinates)
                            .setHTML(popupContent)
                            .addTo(map);
                    });
                    
                    // Update total count
                    totalLocations += data.features.length;
                    updateCounts();
                })
                .catch(error => {
                    console.warn(`Could not load ${dataset.name} data:`, error);
                });
        }
        
        function updateCounts() {
            document.getElementById('total-count').textContent = totalLocations;
            updateVisibleCount();
        }
        
        function updateVisibleCount() {
            let visibleCount = 0;
            datasets.forEach(dataset => {
                const toggle = document.getElementById(`${dataset.id}-toggle`);
                if (toggle.checked && map.getLayer(`${dataset.id}-layer`)) {
                    const source = map.getSource(dataset.id);
                    if (source && source._data) {
                        visibleCount += source._data.features.length;
                    }
                }
            });
            document.getElementById('visible-count').textContent = visibleCount;
        }
    </script>
</body>
</html>

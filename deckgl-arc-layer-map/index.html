<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Real world link-address</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #ffffff;
    }
    
    .container {
      position: relative;
      height: 100vh;
      width: 100vw;
    }
    
    .header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: linear-gradient(180deg, 
        rgba(26, 26, 26, 0.95) 0%, 
        rgba(26, 26, 26, 0.7) 40%, 
        rgba(26, 26, 26, 0) 100%);
      padding: 32px 40px 20px 40px;
      pointer-events: none;
    }
    
    .header > * {
      pointer-events: auto;
    }
    
    .title {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #00c6ff 0%, #ff8c00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    
    .intro {
      font-size: 1.1rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.6;
      max-width: 600px;
      letter-spacing: 0.01em;
    }
    
    #map {
      height: 100%;
      width: 100%;
    }
    
    .mapboxgl-ctrl-logo, .mapboxgl-ctrl-attrib {
      opacity: 0.6;
    }
    
    @media (max-width: 768px) {
      .header {
        padding: 24px 24px 48px 24px;
      }
      
      .title {
        font-size: 2rem;
      }
      
      .intro {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title">Real world link-address</h1>
      <p class="intro">By connecting street view text locations with referenced addresses to visualize how abstract address text links to spatial positions</p>
    </div>
    <div id="map"></div>
  </div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <script src="https://unpkg.com/deck.gl@8.9.36/dist.min.js"></script>
  <script src="https://unpkg.com/@deck.gl/mapbox@8.9.36/dist.min.js"></script>
  <script>
    const MAPBOX_TOKEN = 'pk.eyJ1IjoiYW5kcmV3OWl1IiwiYSI6ImNtZGk0ejdrZTA5OWQyaXBtdWhlMTdpd2EifQ.SG4pkm1FkJI79DoutAJmrw';
    mapboxgl.accessToken = MAPBOX_TOKEN;

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/dark-v11',
      center: [-73.987, 40.748],
      zoom: 10.8,
      pitch: 60,
      bearing: -20
    });

    fetch('./data/lines.geojson')
      .then(r => r.json())
      .then(geo => {
        const arcs = (geo.features || [])
          .filter(f => f && f.geometry && f.geometry.type === 'LineString' && Array.isArray(f.geometry.coordinates) && f.geometry.coordinates.length >= 2)
          .map(f => {
            const coordinates = f.geometry.coordinates;
            const start = coordinates[0];
            const end = coordinates[coordinates.length - 1];
            return { source: start, target: end };
          });

        const arcLayer = new deck.ArcLayer({
          id: 'arc-layer',
          data: arcs,
          getSourcePosition: d => d.source,
          getTargetPosition: d => d.target,
          getSourceColor: [0, 200, 255, 180],
          getTargetColor: [255, 140, 0, 180],
          getWidth: 2,
          greatCircle: true,
          pickable: true,
          autoHighlight: true
        });

        const overlay = new deck.MapboxOverlay({
          interleaved: true,
          layers: [arcLayer]
        });
        map.addControl(overlay);

        // Fit bounds to all points
        const allLngLat = arcs.flatMap(a => [a.source, a.target]);
        if (allLngLat.length > 0) {
          const lngs = allLngLat.map(p => p[0]);
          const lats = allLngLat.map(p => p[1]);
          const sw = [Math.min(...lngs), Math.min(...lats)];
          const ne = [Math.max(...lngs), Math.max(...lats)];
          map.fitBounds([sw, ne], { padding: 60, duration: 1000 });
        }
      })
      .catch(err => console.error('Failed to load GeoJSON', err));
  </script>
</body>
</html>
